name = "categorical-triz"
defaultTargets = ["CategoricalTriz", "Witnesses", "Certificates"]

# Mathlib tag must match lean-toolchain; bump both together. `lake exe cache get` then
# fetches prebuilt oleans for this exact revision.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "CategoricalTriz"

# Non-vacuity witnesses for the lemmas above; a default target, so `lake build --wfail` and CI check them.
[[lean_lib]]
name = "Witnesses"

# Per-instance certificates of four examples, as `triz_export` format `lean`, `triz_dynamics`, and
# `triz_weakness` write them; a default target, so CI checks them. tests/act-cert.test.ts keeps them
# equal to the generator's output.
[[lean_lib]]
name = "Certificates"
