name = "categorical-triz"
defaultTargets = ["CategoricalTriz", "Witnesses", "Semantics", "SemanticsWitnesses", "Graded", "Hierarchy", "Restriction", "Naturality", "Propagation", "JointResidual", "ControlledTrim", "SteadyStateGfp", "MeanCost", "Lifecycle", "ComponentSearch", "SourceSupport", "SynthesisWitnesses", "Symbolic"]

[[lean_lib]]
name = "Symbolic"
allowNonModules = true

[[lean_lib]]
name = "SourceSupport"
allowNonModules = true

[[lean_lib]]
name = "SynthesisWitnesses"
allowNonModules = true

[[lean_lib]]
name = "ComponentSearch"
allowNonModules = true

# Mathlib tag must match lean-toolchain; bump both together. `lake exe cache get` then
# fetches prebuilt oleans for this exact revision.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "CategoricalTriz"
# The theory retains the non-module syntax.
allowNonModules = true

# Non-vacuity witnesses for the lemmas above; a default target, so `lake build --wfail` and CI check them.
[[lean_lib]]
name = "Witnesses"
# The theory retains the non-module syntax.
allowNonModules = true

# The compositional semantics of declared behaviour (series, parallel, feedback, monotonicity, and
# the functor to RelCat); tests/act-semantics.test.ts checks the evaluator against it.
[[lean_lib]]
name = "Semantics"
# The theory retains the non-module syntax.
allowNonModules = true

# Non-vacuity witnesses and counterexamples for Semantics.
[[lean_lib]]
name = "SemanticsWitnesses"
# The theory retains the non-module syntax.
allowNonModules = true

# Graded residuals and the Boolean/min-plus instances.
[[lean_lib]]
name = "Graded"
# The theory retains the non-module syntax.
allowNonModules = true

# Arbitrary-wiring substitution semantics and witnesses.
[[lean_lib]]
name = "Hierarchy"
# The theory retains the non-module syntax.
allowNonModules = true

# Restriction-grid lifting and conditional residual descent.
[[lean_lib]]
name = "Restriction"
# The theory retains the non-module syntax.
allowNonModules = true

# Semantic transport under explicit equivalences.
[[lean_lib]]
name = "Naturality"
# The theory retains the non-module syntax.
allowNonModules = true

# One scoped arc-consistency support pass preserves the exact solution set.
[[lean_lib]]
name = "Propagation"
# The theory retains the non-module syntax.
allowNonModules = true

# Joint merged-hole residuals and nonfactorization.
[[lean_lib]]
name = "JointResidual"
# The theory retains the non-module syntax.
allowNonModules = true

# Absorber reattachment as explicit typed deletion/gluing rule data.
[[lean_lib]]
name = "ControlledTrim"
# The theory retains the non-module syntax.
allowNonModules = true

# Complete-valuation consistency as a greatest fixed point.
[[lean_lib]]
name = "SteadyStateGfp"
# The theory retains the non-module syntax.
allowNonModules = true

[[lean_lib]]
name = "MeanCost"
# The theory retains the non-module syntax.
allowNonModules = true

[[lean_lib]]
name = "Lifecycle"
# The theory retains the non-module syntax.
allowNonModules = true
