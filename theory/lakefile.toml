name = "categorical-triz"
defaultTargets = ["CategoricalTriz", "Witnesses", "Certificates", "Semantics", "SemanticsWitnesses", "Graded", "Hierarchy", "Restriction", "Naturality"]

# Mathlib tag must match lean-toolchain; bump both together. `lake exe cache get` then
# fetches prebuilt oleans for this exact revision.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "CategoricalTriz"

# Non-vacuity witnesses for the lemmas above; a default target, so `lake build --wfail` and CI check them.
[[lean_lib]]
name = "Witnesses"

# Per-instance certificates of seven examples, as `triz_export` format `lean`, `triz_dynamics`,
# `triz_weakness`, and `triz_behavior` write them; a default target, so CI checks them.
# tests/act-cert.test.ts keeps them equal to the generator's output.
[[lean_lib]]
name = "Certificates"

# The compositional semantics of declared behaviour (series, parallel, feedback, monotonicity, and
# the functor to RelCat); tests/act-semantics.test.ts checks the evaluator against it.
[[lean_lib]]
name = "Semantics"

# Non-vacuity witnesses and counterexamples for Semantics.
[[lean_lib]]
name = "SemanticsWitnesses"

# Graded residuals and the Boolean/min-plus instances.
[[lean_lib]]
name = "Graded"

# Arbitrary-wiring substitution semantics and witnesses.
[[lean_lib]]
name = "Hierarchy"

# Restriction-grid lifting and conditional residual descent.
[[lean_lib]]
name = "Restriction"

# Semantic transport under explicit equivalences.
[[lean_lib]]
name = "Naturality"
