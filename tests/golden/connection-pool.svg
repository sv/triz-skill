<svg xmlns="http://www.w3.org/2000/svg" width="877" height="373" viewBox="0 0 877 373" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#111111">
<title>Batch workers sharing a database connection pool (same wiring shape as bearing-heat; costs illustrative)</title>
<defs><marker id="arrow-dark" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333333"/></marker><marker id="arrow-red" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd0000"/></marker><marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0000cd"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="438.5" y="30" text-anchor="middle" font-size="16" font-weight="bold">Batch workers sharing a database connection pool (same wiring shape as bearing-heat; costs illustrative)</text>
<g class="legend"><rect x="174" y="43" width="14" height="10" fill="#d6e4f5" stroke="#333333" stroke-width="1"/><text x="192" y="52">«tool»</text><rect x="235" y="43" width="14" height="10" fill="#d5ecd4" stroke="#333333" stroke-width="2.4"/><text x="253" y="52">«product»</text><rect x="314" y="43" width="14" height="10" fill="#e8e8e8" stroke="#333333" stroke-width="1"/><text x="332" y="52">«mediator»</text><rect x="399" y="43" width="14" height="10" fill="#f3f3f3" stroke="#333333" stroke-width="1" stroke-dasharray="4 3"/><text x="417" y="52">«environment»</text><line x1="501" y1="48" x2="527" y2="48" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="533" y="52">useful</text><line x1="576" y1="48" x2="602" y2="48" stroke="#cd0000" stroke-width="1.6" marker-end="url(#arrow-red)"/><text x="608" y="52" fill="#cd0000">harmful</text><text x="658" y="52" font-style="italic">open port</text></g>
<g class="box tool"><title>scheduler</title><rect x="227" y="160" width="109" height="62" rx="4" fill="#ffffff"/><path d="M227 196V164a4 4 0 0 1 4 -4H332a4 4 0 0 1 4 4V196Z" fill="#d6e4f5"/><rect x="227" y="160" width="109" height="62" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="281.5" y="176" text-anchor="middle" font-size="13" font-weight="bold">Job scheduler</text><text x="281.5" y="190" text-anchor="middle" font-size="9">«tool»</text><text class="port out" x="328" text-anchor="end" y="210" font-size="11">dispatch <tspan font-size="9" fill="#595959">jobs</tspan></text></g>
<g class="box product"><title>worker</title><rect x="566" y="226" width="142" height="102" rx="4" fill="#ffffff"/><path d="M566 262V230a4 4 0 0 1 4 -4H704a4 4 0 0 1 4 4V262Z" fill="#d5ecd4"/><rect x="566" y="226" width="142" height="102" rx="4" fill="none" stroke="#333333" stroke-width="2.4"/><text x="637" y="242" text-anchor="middle" font-size="13" font-weight="bold">Batch worker</text><text x="637" y="256" text-anchor="middle" font-size="9">«product»</text><text class="port in" x="574" y="276" font-size="11">jobs-in <tspan font-size="9" fill="#595959">jobs</tspan></text><text class="port in" x="574" y="296" font-size="11">session-in <tspan font-size="9" fill="#595959">sessions</tspan></text><text class="port in" x="574" y="316" font-size="11">wait-in <tspan font-size="9" fill="#595959">wait</tspan></text><text class="port out" x="700" text-anchor="end" y="276" font-size="11">retry <tspan font-size="9" fill="#595959">retries</tspan></text></g>
<g class="box mediator"><title>pool</title><rect x="169" y="252" width="167" height="82" rx="4" fill="#ffffff"/><path d="M169 288V256a4 4 0 0 1 4 -4H332a4 4 0 0 1 4 4V288Z" fill="#e8e8e8"/><rect x="169" y="252" width="167" height="82" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="252.5" y="268" text-anchor="middle" font-size="13" font-weight="bold">Connection pool</text><text x="252.5" y="282" text-anchor="middle" font-size="9">«mediator»</text><text class="port in" x="177" y="302" font-size="11">retry-in <tspan font-size="9" fill="#595959">retries</tspan></text><text class="port out" x="328" text-anchor="end" y="302" font-size="11">lease <tspan font-size="9" fill="#595959">sessions</tspan></text><text class="port out" x="328" text-anchor="end" y="322" font-size="11">contention <tspan font-size="9" fill="#595959">wait</tspan></text></g>
<g class="box mediator"><title>database</title><rect x="304" y="78" width="211" height="62" rx="4" fill="#ffffff"/><path d="M304 114V82a4 4 0 0 1 4 -4H511a4 4 0 0 1 4 4V114Z" fill="#e8e8e8"/><rect x="304" y="78" width="211" height="62" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="409.5" y="94" text-anchor="middle" font-size="13" font-weight="bold">Database (direct connections)</text><text x="409.5" y="108" text-anchor="middle" font-size="9">«mediator»</text><text class="port out" x="507" text-anchor="end" y="128" font-size="11" font-style="italic">connect <tspan font-size="9" fill="#595959">sessions</tspan></text></g>
<g class="box environment"><title>tracing</title><rect x="159" y="78" width="125" height="62" rx="4" fill="#ffffff"/><path d="M159 114V82a4 4 0 0 1 4 -4H280a4 4 0 0 1 4 4V114Z" fill="#f3f3f3"/><rect x="159" y="78" width="125" height="62" rx="4" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="4 3"/><text x="221.5" y="94" text-anchor="middle" font-size="13" font-weight="bold">Tracing backend</text><text x="221.5" y="108" text-anchor="middle" font-size="9">«environment»</text><text class="port in" x="167" y="128" font-size="11" font-style="italic">spans <tspan font-size="9" fill="#595959">wait</tspan></text></g>
<g class="function useful"><title>w-dispatch</title><polyline points="340,206 512,206 512,272 562,272" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="414.5" y="200" stroke="#ffffff" stroke-width="3" paint-order="stroke">dispatch jobs to</text></g>
<g class="function useful"><title>w-lease</title><polyline points="340,298 350,298 350,292 562,292" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="410.5" y="286" stroke="#ffffff" stroke-width="3" paint-order="stroke">lease sessions to</text></g>
<g class="function harmful"><title>w-wait</title><polyline points="340,318 512,318 512,312 562,312" fill="none" stroke="#cd0000" stroke-width="1.6" marker-end="url(#arrow-red)"/><text x="416.5" y="312" fill="#cd0000" stroke="#ffffff" stroke-width="3" paint-order="stroke">block [harmful]</text></g>
<g class="function harmful"><title>w-retry</title><polyline points="712,272 722,272 722,344 155,344 155,298 165,298" fill="none" stroke="#cd0000" stroke-width="1.6" marker-end="url(#arrow-red)"/><text x="400" y="338" fill="#cd0000" stroke="#ffffff" stroke-width="3" paint-order="stroke">retry against [harmful]</text></g>
</svg>
