<svg xmlns="http://www.w3.org/2000/svg" width="699" height="373" viewBox="0 0 699 373" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#111111">
<title>Motor shaft on a rolling-element bearing, with declared shaft temperature dynamics</title>
