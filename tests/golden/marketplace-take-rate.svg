<g class="box tool"><title>platform</title><rect x="42" y="84" width="157" height="82" rx="4" fill="#ffffff"/><path d="M42 120V88a4 4 0 0 1 4 -4H195a4 4 0 0 1 4 4V120Z" fill="#d6e4f5"/><rect x="42" y="84" width="157" height="82" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="120.5" y="100" text-anchor="middle" font-size="13" font-weight="bold">Marketplace platform</text><text x="120.5" y="114" text-anchor="middle" font-size="9">«tool»</text><text class="port in" x="50" y="134" font-size="11">revenue <tspan font-size="9" fill="#595959">gmv</tspan></text><text class="port out" x="191" text-anchor="end" y="134" font-size="11">match <tspan font-size="9" fill="#595959">orders</tspan></text><text class="port out" x="191" text-anchor="end" y="154" font-size="11">charge <tspan font-size="9" fill="#595959">fee</tspan></text></g>
