<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="234" viewBox="0 0 1060 234" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#111111">
<title>Two-sided marketplace raising its take rate (working translation; loop is a hypothesis to test)</title>
