<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="351" viewBox="0 0 1255 351" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#111111">
<title>Read path of an API behind a Redis cache</title>
<defs><marker id="arrow-dark" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333333"/></marker><marker id="arrow-red" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd0000"/></marker><marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0000cd"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="627.5" y="30" text-anchor="middle" font-size="16" font-weight="bold">Read path of an API behind a Redis cache</text>
<g class="legend"><rect x="414" y="43" width="14" height="10" fill="#d6e4f5" stroke="#333333" stroke-width="1"/><text x="432" y="52">«tool»</text><rect x="475" y="43" width="14" height="10" fill="#d5ecd4" stroke="#333333" stroke-width="2.4"/><text x="493" y="52">«product»</text><rect x="554" y="43" width="14" height="10" fill="#e8e8e8" stroke="#333333" stroke-width="1"/><text x="572" y="52">«mediator»</text><line x1="639" y1="48" x2="665" y2="48" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="671" y="52">useful</text><line x1="714" y1="48" x2="740" y2="48" stroke="#cd0000" stroke-width="1.6" marker-end="url(#arrow-red)"/><text x="746" y="52" fill="#cd0000">harmful</text><text x="796" y="52" font-style="italic">open port</text></g>
<g class="box product"><title>client</title><rect x="42" y="149" width="136" height="62" rx="4" fill="#ffffff"/><path d="M42 185V153a4 4 0 0 1 4 -4H174a4 4 0 0 1 4 4V185Z" fill="#d5ecd4"/><rect x="42" y="149" width="136" height="62" rx="4" fill="none" stroke="#333333" stroke-width="2.4"/><text x="110" y="165" text-anchor="middle" font-size="13" font-weight="bold">API client</text><text x="110" y="179" text-anchor="middle" font-size="9">«product»</text><text class="port in" x="50" y="199" font-size="11">in <tspan font-size="9" fill="#595959">response</tspan></text><text class="port out" x="170" text-anchor="end" y="199" font-size="11">out <tspan font-size="9" fill="#595959">request</tspan></text></g>
<g class="box mediator"><title>gateway</title><rect x="322" y="149" width="131" height="82" rx="4" fill="#ffffff"/><path d="M322 185V153a4 4 0 0 1 4 -4H449a4 4 0 0 1 4 4V185Z" fill="#e8e8e8"/><rect x="322" y="149" width="131" height="82" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="387.5" y="165" text-anchor="middle" font-size="13" font-weight="bold">API gateway</text><text x="387.5" y="179" text-anchor="middle" font-size="9">«mediator»</text><text class="port in" x="330" y="199" font-size="11">in <tspan font-size="9" fill="#595959">request</tspan></text><text class="port out" x="445" text-anchor="end" y="199" font-size="11">fwd <tspan font-size="9" fill="#595959">request</tspan></text><text class="port out" x="445" text-anchor="end" y="219" font-size="11" font-style="italic">edge-cache <tspan font-size="9" fill="#595959">cached</tspan></text></g>
<g class="box tool"><title>app</title><rect x="722" y="149" width="172" height="102" rx="4" fill="#ffffff"/><path d="M722 185V153a4 4 0 0 1 4 -4H890a4 4 0 0 1 4 4V185Z" fill="#d6e4f5"/><rect x="722" y="149" width="172" height="102" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="808" y="165" text-anchor="middle" font-size="13" font-weight="bold">API service</text><text x="808" y="179" text-anchor="middle" font-size="9">«tool»</text><text class="port in" x="730" y="199" font-size="11">req <tspan font-size="9" fill="#595959">request</tspan></text><text class="port in" x="730" y="219" font-size="11">cache-in <tspan font-size="9" fill="#595959">cached</tspan></text><text class="port in" x="730" y="239" font-size="11">rows-in <tspan font-size="9" fill="#595959">rows</tspan></text><text class="port out" x="886" text-anchor="end" y="199" font-size="11">resp <tspan font-size="9" fill="#595959">response</tspan></text><text class="port out" x="886" text-anchor="end" y="219" font-size="11">lookup <tspan font-size="9" fill="#595959">query</tspan></text><text class="port out" x="886" text-anchor="end" y="239" font-size="11" font-style="italic">memo <tspan font-size="9" fill="#595959">cached</tspan></text></g>
<g class="box mediator"><title>redis</title><rect x="330" y="261" width="123" height="62" rx="4" fill="#ffffff"/><path d="M330 297V265a4 4 0 0 1 4 -4H449a4 4 0 0 1 4 4V297Z" fill="#e8e8e8"/><rect x="330" y="261" width="123" height="62" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="391.5" y="277" text-anchor="middle" font-size="13" font-weight="bold">Redis cluster</text><text x="391.5" y="291" text-anchor="middle" font-size="9">«mediator»</text><text class="port in" x="338" y="311" font-size="11">get <tspan font-size="9" fill="#595959">query</tspan></text><text class="port out" x="445" text-anchor="end" y="311" font-size="11">hit <tspan font-size="9" fill="#595959">cached</tspan></text></g>
<g class="box mediator"><title>postgres</title><rect x="1087" y="169" width="126" height="62" rx="4" fill="#ffffff"/><path d="M1087 205V173a4 4 0 0 1 4 -4H1209a4 4 0 0 1 4 4V205Z" fill="#e8e8e8"/><rect x="1087" y="169" width="126" height="62" rx="4" fill="none" stroke="#333333" stroke-width="1"/><text x="1150" y="185" text-anchor="middle" font-size="13" font-weight="bold">Postgres</text><text x="1150" y="199" text-anchor="middle" font-size="9">«mediator»</text><text class="port in" x="1095" y="219" font-size="11">sql <tspan font-size="9" fill="#595959">query</tspan></text><text class="port out" x="1205" text-anchor="end" y="219" font-size="11">result <tspan font-size="9" fill="#595959">rows</tspan></text></g>
<g class="function useful"><title>w-call</title><polyline points="182,195 318,195" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="242" y="189" stroke="#ffffff" stroke-width="3" paint-order="stroke">call</text></g>
<g class="function useful"><title>w-route</title><polyline points="457,195 718,195" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="575.5" y="189" stroke="#ffffff" stroke-width="3" paint-order="stroke">route</text></g>
<g class="function useful"><title>w-serve</title><polyline points="898,195 908,195 908,118 28,118 28,195 38,195" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="374.5" y="112" stroke="#ffffff" stroke-width="3" paint-order="stroke">serve</text></g>
<g class="function useful"><title>w-lookup</title><polyline points="898,215 918,215 918,93 268,93 268,307 326,307" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="574" y="87" stroke="#ffffff" stroke-width="3" paint-order="stroke">query</text></g>
<g class="function useful"><title>w-cache</title><polyline points="457,307 467,307 467,221 668,221 668,215 718,215" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="548.5" y="215" stroke="#ffffff" stroke-width="3" paint-order="stroke">cache results for</text></g>
<g class="function harmful"><title>w-stale</title><polyline points="457,307 668,307 668,215 718,215" fill="none" stroke="#cd0000" stroke-width="1.6" marker-end="url(#arrow-red)"/><text x="517" y="301" fill="#cd0000" stroke="#ffffff" stroke-width="3" paint-order="stroke">serve stale results to [harmful]</text></g>
<g class="function useful"><title>w-sql</title><polyline points="898,215 1083,215" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="977" y="209" stroke="#ffffff" stroke-width="3" paint-order="stroke">query</text></g>
<g class="function useful"><title>w-rows</title><polyline points="1217,215 1227,215 1227,261 678,261 678,235 718,235" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow-dark)"/><text x="958" y="255" stroke="#ffffff" stroke-width="3" paint-order="stroke">return rows to</text></g>
</svg>
