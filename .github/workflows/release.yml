name: Release

on:
  push:
    tags: ["v*"]

# Tokenless: npm and the MCP Registry both authenticate this workflow by its GitHub OIDC identity.
# One-time setup (npm trusted publisher, then optionally disallowing tokens) is in docs/PUBLISHING.md.

jobs:
  publish:
    name: Verify + publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # npm trusted publishing via pnpm (OIDC); provenance is attached automatically
      contents: write   # GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No registry-url: its generated .npmrc would point pnpm at a placeholder NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$tag"
          test "$(node -p "require('./server.json').version")" = "$tag"
          test "$(node -p "require('./server.json').packages[0].version")" = "$tag"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/smoke-mcp.mjs dist/server.js

      # pnpm (>= 11) publishes natively and exchanges the job's OIDC token with npm; the tag
      # checkout is a detached HEAD, so skip pnpm's publish-branch check (the tag gate above holds).
      # A re-run after a later step failed finds the version on npm and skips the upload.
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "$name@$tag" version 2>/dev/null)" = "$tag" ]; then
            echo "$name@$tag is already on npm; skipping publish"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  mcp-registry:
    # Separate job so a registry hiccup can be re-run without re-publishing to npm.
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25   # up to 15 waiting for npm, then publish retries
    permissions:
      id-token: write   # mcp-publisher login github-oidc
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # The registry verifies mcpName inside the published npm package, and npm can take
      # minutes to list a new version (0.4.0 took about 6). Wait for it before logging in,
      # so the registry token is fresh when publish runs.
      - name: Wait for the version on npm
        run: |
          name="$(jq -r .name package.json)"
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 60); do
            if [ "$(curl --silent "https://registry.npmjs.org/$name/$version" | jq -r .version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is on npm"
              exit 0
            fi
            echo "$name@$version not on npm yet ($attempt/60); checking again in 15s"
            sleep 15
          done
          echo "::error::$name@$version did not appear on npm within 15 minutes"
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Retry briefly in case the registry has not seen the npm version yet.
      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
