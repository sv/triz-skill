name: Lean

# Paths: the theory and checker, plus what the Lean-backed tests generate certificates from.
on:
  push:
    branches: [main]
    paths: ["theory/**", "scripts/certify.*", "src/**", "tests/**", "examples/function-models/**", "skills/triz-innovation/data/**", "package.json", "pnpm-lock.yaml", ".github/workflows/lean.yml"]
  pull_request:
    branches: [main]
    paths: ["theory/**", "scripts/certify.*", "src/**", "tests/**", "examples/function-models/**", "skills/triz-innovation/data/**", "package.json", "pnpm-lock.yaml", ".github/workflows/lean.yml"]
  # Manual run, regardless of paths: `gh workflow run lean.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build theory (no sorry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Elan and the toolchain only; the Mathlib cache and the build are the next two steps.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: theory
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
          lint: false

      # Prebuilt oleans for the Mathlib modules theory/ imports and their import closure only, not
      # all of Mathlib, from cache.mathlib.org as lean-action would fetch them.
      - name: Mathlib cache (the theory's imports)
        working-directory: theory
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe cache get $(find . -name '*.lean' -not -path './.lake/*' -exec sed -n 's/^import //p' {} + | tr -s ' ' '\n' | grep '^Mathlib\.' | sort -u)

      # --wfail turns any `sorry` warning into a failure.
      - name: Build theory (no sorry)
        working-directory: theory
        run: lake build --wfail

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # The certificate fixtures were built above; this applies the acceptance rule (no warning,
      # every theorem elaborated, standard axioms only) and checks that tampered copies fail, all
      # in one Lean process.
      - name: Certificates (acceptance + tamper)
        run: node scripts/certify.mjs --local --tamper theory/Certificates/*.lean

      # The tests that need Lean (fixtures and hostile generated certificates accepted, tampered
      # copies rejected; one Lean process per test) skip without it or with TRIZ_SKIP_LEAN=1;
      # TRIZ_REQUIRE_LEAN=1 runs them and makes a missing build fail instead.
      - run: pnpm install --frozen-lockfile

      - name: Tests with Lean required
        run: pnpm test
        env:
          TRIZ_REQUIRE_LEAN: "1"
