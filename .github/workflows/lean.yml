name: Lean

on:
  push:
    branches: [main]
    paths: ["theory/**", "scripts/certify.mjs", ".github/workflows/lean.yml"]
  pull_request:
    branches: [main]
    paths: ["theory/**", "scripts/certify.mjs", ".github/workflows/lean.yml"]
  # Manual run, regardless of paths: `gh workflow run lean.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build theory (no sorry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Mathlib oleans come from `lake exe cache get`; --wfail turns any `sorry` warning into a failure.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: theory
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false

      # The certificate fixtures were built above; this applies the acceptance rule (no warning,
      # every theorem elaborated, standard axioms only) and checks that tampered copies fail.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Certificates (acceptance + tamper)
        run: node scripts/certify.mjs --local --tamper theory/Certificates/*.lean
