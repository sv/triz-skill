name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run: Actions tab → CI → Run workflow, or `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The DOT export tests render with Graphviz when it is installed, and skip otherwise.
      - name: Install Graphviz
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends graphviz

      - run: pnpm knowledge:check

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm example:effects

      - run: pnpm example:effects-compare

      - run: pnpm example:effects-products

      - run: pnpm example:effects-reduction

      - run: pnpm example:effects-configurations

      - run: pnpm example:effects-recent-patents

      - name: MCP handshake smoke test (dist)
        run: node scripts/smoke-mcp.mjs dist/server.js

      - run: pnpm test

      - name: Eval runner dry-run (offline, keyless)
        run: |
          node --import tsx scripts/run-evals.mjs --suite no-recall --limit 3 --dry-run
          node --import tsx scripts/run-evals.mjs --suite reasoning --dry-run
          node --import tsx scripts/run-evals.mjs --suite published --dry-run
