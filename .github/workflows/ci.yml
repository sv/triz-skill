name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: MCP handshake smoke test (dist)
        run: node scripts/smoke-mcp.mjs dist/server.js

      - run: pnpm test

      - name: Eval runner dry-run (offline, keyless)
        run: |
          node --import tsx scripts/run-evals.mjs --suite no-recall --limit 3 --dry-run
          node --import tsx scripts/run-evals.mjs --suite reasoning --dry-run
          node --import tsx scripts/run-evals.mjs --suite published --dry-run
